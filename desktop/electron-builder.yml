appId: com.web3.desktop
productName: Web3.0
copyright: © DR SANJAY ANBU

directories:
  output: release
  buildResources: assets

# Everything the app needs is pre-bundled into dist/ (main.cjs, node-bundle.cjs, dashboard/),
# so there are no runtime node_modules to package.
files:
  - dist/**/*
  - package.json

win:
  # Produces both a .msi and an .exe (NSIS) installer.
  target:
    - msi
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

msi:
  oneClick: false

linux:
  # AppImage runs on any distro (double-click, no install); .deb for Debian/Ubuntu apt.
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Network
  synopsis: Run a Web3.0 node and open the dashboard in one window
  # .deb requires a maintainer with an email; use the GitHub noreply address (no personal email in-repo).
  maintainer: DR SANJAY ANBU <sanjaydoc@users.noreply.github.com>
  vendor: DR SANJAY ANBU
  desktop:
    StartupWMClass: Web3.0

deb:
  # The npm package is scoped ("@web3/desktop") — not a valid Debian package name (no @ or /).
  # Give the .deb a clean lowercase name → web3_<version>_amd64.deb.
  packageName: web3
