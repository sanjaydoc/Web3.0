name: android (free)

# Builds the Android APK on the PUBLIC repo's FREE Actions minutes, then publishes it to a rolling
# 'android' pre-release here. Like the desktop (free) workflow, it clones the PRIVATE web4-core
# source into the throwaway runner with a PAT, builds, and discards it — the node source stays
# private, and the build costs nothing against the private repo's minute quota.
#
# One-time setup (shared with desktop (free)): a RELEASE_PAT repo secret = a classic PAT with the
# `repo` scope (reads private web4-core to check it out, and writes the release here).
#
# Run it: Actions → "android (free)" → Run workflow → pick the web4-core branch/tag.
# Result: https://github.com/sanjaydoc/Web4.0/releases/download/android/Web4.0-android.apk
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'web4-core branch or tag to build'
        default: 'main'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private node source
        uses: actions/checkout@v4
        with:
          repository: sanjaydoc/web4-core
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.RELEASE_PAT }}

      # --- JS toolchain: build the dashboard (workspace) + bundle the node, assemble www/ ---
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >=22.
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci
      - name: Prepare web payload
        working-directory: mobile
        run: npm run prepare:app

      # --- Android toolchain: sync Capacitor + Gradle assemble ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "mobile/dist/Web4.0-android.apk"
          ls -lh mobile/dist

      - name: Publish APK to the rolling 'android' pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: android
          name: Web4.0 for Android (latest)
          prerelease: true
          body: |
            **Web4.0 for Android** — a full peer node on your phone (nodejs-mobile), with the dashboard
            in a WebView pointed at the local node. Joins the same shared chain as the desktop app.

            Debug build: to install, enable **"Install unknown apps"** for your browser/file manager,
            then open the APK. First launch unpacks the Node runtime and starts your node, then shows
            the "Run a node — quick setup" onboarding.
          files: mobile/dist/Web4.0-android.apk
