name: android

# Builds the Android APK — a full peer node running on the phone via nodejs-mobile, with the
# dashboard in a Capacitor WebView pointed at the local node (http://127.0.0.1:8787). The node joins
# the shared chain via the bundled network.json (same as the desktop app).
#
# Runs on any push that touches mobile/ (so we can iterate the build to green) and on demand.
# Release attachment to the public GitHub Release (alongside the desktop installers) is wired in
# once the APK builds green.
on:
  push:
    # The APK bundles the dashboard + the node, so a change to any of those must rebuild it too —
    # not just changes under mobile/.
    paths:
      - 'mobile/**'
      - 'apps/dashboard/**'
      - 'services/web3-node/**'
      - 'packages/**'
      - 'desktop/network.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # --- JS toolchain: build the dashboard (workspace) + bundle the node, assemble www/ ---
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >=22.
          node-version: 22
          cache: pnpm

      # Workspace deps — needed so the dashboard can build from the monorepo.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Mobile deps (Capacitor + capacitor-nodejs + esbuild) — standalone, not in the workspace.
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      # Build the dashboard, bundle the node into one file (target node18), assemble mobile/www.
      - name: Prepare web payload
        working-directory: mobile
        run: npm run prepare:app

      # --- Android toolchain: sync Capacitor + Gradle assemble ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Copies www/ (dashboard + nodejs project) into the android assets and wires the plugin.
      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "mobile/dist/Web3.0-android.apk"
          ls -lh mobile/dist

      # Best-effort convenience copy. Non-blocking: Actions artifact storage can be quota-full, and
      # the real delivery is the public release below.
      - name: Upload APK (artifact)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web3-android-apk
          path: mobile/dist/Web3.0-android.apk

      # Publish the APK to a rolling pre-release on the PUBLIC repo so anyone can sideload it from a
      # stable URL (bypasses the Actions artifact quota entirely). Same PAT the desktop installers use.
      #   → https://github.com/sanjaydoc/Web3.0/releases/download/android/Web3.0-android.apk
      - name: Publish APK to the PUBLIC 'android' pre-release
        uses: softprops/action-gh-release@v2
        with:
          repository: sanjaydoc/Web3.0
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: android
          name: Web3.0 for Android (latest)
          prerelease: true
          body: |
            **Web3.0 for Android** — a full peer node on your phone (nodejs-mobile), with the dashboard
            in a WebView pointed at the local node. Joins the same shared chain as the desktop app.

            Debug build: to install, enable **"Install unknown apps"** for your browser/file manager,
            then open the APK. First launch unpacks the Node runtime and starts your node, then shows
            the "Run a node — quick setup" onboarding.

            Rebuilt automatically from the latest `mobile/` changes.
          files: mobile/dist/Web3.0-android.apk
