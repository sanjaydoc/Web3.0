name: desktop

# Builds the desktop installers. Runs on a version tag (attaches the installers to a GitHub Release)
# or on demand via "Run workflow".
#   Windows → .msi + .exe   |   Linux → .AppImage + .deb
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # Needed so the release-attach step can create/update the GitHub Release for the tag.
    # Without this the GITHUB_TOKEN is read-only and softprops/action-gh-release returns 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # No version here — pnpm/action-setup@v4 reads it from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Workspace deps — needed so the dashboard can build from the monorepo.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Desktop deps (electron, electron-builder, esbuild) — standalone, not in the workspace.
      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node into one file, then packages the installers.
      - name: Build installers
        working-directory: desktop
        run: npm run dist

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-windows
          path: |
            desktop/release/*.msi
            desktop/release/*.exe

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.msi
            desktop/release/*.exe

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node, then packages the .AppImage + .deb.
      - name: Build installers
        working-directory: desktop
        run: npm run dist:linux

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb
