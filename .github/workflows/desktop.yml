name: desktop

# Builds the Windows desktop installer (.msi + .exe). Runs on a version tag (attaches the installers
# to a GitHub Release) or on demand via "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Workspace deps — needed so the dashboard can build from the monorepo.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Desktop deps (electron, electron-builder, esbuild) — standalone, not in the workspace.
      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node into one file, then packages the installers.
      - name: Build installers
        working-directory: desktop
        run: npm run dist

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-windows
          path: |
            desktop/release/*.msi
            desktop/release/*.exe

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.msi
            desktop/release/*.exe
