name: desktop

# Builds the desktop installers. Runs on a version tag (attaches the installers to a GitHub Release)
# or on demand via "Run workflow".
#   Windows → .msi + .exe   |   Linux → .AppImage + .deb   |   macOS → .dmg (universal)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The desktop app is a client of the shared network: the bundled dashboard is built with this URL,
# so every install talks to the same canonical node — one shared network, no per-app islands.
env:
  VITE_WEB3_URL: https://104.197.128.113.nip.io

jobs:
  windows:
    runs-on: windows-latest
    # The release is published cross-repo with PUBLIC_RELEASE_TOKEN (a PAT), so GITHUB_TOKEN's
    # contents scope isn't strictly needed here — kept at write as a harmless safety net.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # No version here — pnpm/action-setup@v4 reads it from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Workspace deps — needed so the dashboard can build from the monorepo.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Desktop deps (electron, electron-builder, esbuild) — standalone, not in the workspace.
      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node into one file, then packages the installers.
      - name: Build installers
        working-directory: desktop
        run: npm run dist

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-windows
          path: |
            desktop/release/*.msi
            desktop/release/*.exe

      - name: Attach installers to the PUBLIC release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Publish to the PUBLIC repo so anyone can download — private-repo release assets sit
          # behind a login wall. Cross-repo publishing needs a PAT with Contents:write on
          # sanjaydoc/Web3.0, stored in THIS repo as the PUBLIC_RELEASE_TOKEN secret (GITHUB_TOKEN
          # can't write to another repo).
          repository: sanjaydoc/Web3.0
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/release/*.msi
            desktop/release/*.exe

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node, then packages the .AppImage + .deb.
      - name: Build installers
        working-directory: desktop
        run: npm run dist:linux

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

      - name: Attach installers to the PUBLIC release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: sanjaydoc/Web3.0
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # Unsigned build — don't let electron-builder hunt for a Developer ID cert (it ad-hoc signs instead).
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Builds the dashboard, bundles the node, then packages the universal .dmg.
      - name: Build installer
        working-directory: desktop
        run: npm run dist:mac

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web3-desktop-macos
          path: desktop/release/*.dmg

      - name: Attach installer to the PUBLIC release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: sanjaydoc/Web3.0
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: desktop/release/*.dmg
