# ---------------------------------------------------------------------------
# Dashboard → GitHub Pages deploy workflow  (TEMPLATE for the PUBLIC repo)
#
# This file belongs in the PUBLIC `web3-console` repo, at:
#     .github/workflows/pages.yml
#
# It is kept here (in the private Web3.0 repo, under deploy/) only as a
# ready-to-copy template — GitHub Actions does NOT run files outside
# `.github/workflows/`, so it stays inert here and never collides with this
# repo's own docs Pages workflow.
#
# Assumes the public repo is the dashboard app at its ROOT (i.e. you copied the
# contents of `apps/dashboard/` to the repo root, so `pnpm build` → `dist/`).
# If you keep the monorepo layout instead, change the build to
# `pnpm --filter @web3/dashboard build` and the artifact path to
# `apps/dashboard/dist`.
#
# Before the first run, in the public repo set:
#   Settings → Secrets and variables → Actions → Variables:
#       WEB3_API_URL = https://api.web3.example   (your node's public HTTPS URL)
#   Settings → Pages → Source: GitHub Actions
# ---------------------------------------------------------------------------
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Build dashboard
        run: pnpm build
        env:
          # Baked into the static bundle: where the dashboard finds the live node.
          VITE_WEB3_URL: ${{ vars.WEB3_API_URL }}
      - name: Configure Pages
        # enablement: true turns GitHub Pages on for this repo on the first run.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
